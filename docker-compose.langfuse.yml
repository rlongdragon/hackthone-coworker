# Self-hosted Langfuse v4 (web + worker + postgres + clickhouse + redis + minio),
# built from our fork https://github.com/rlongdragon/langfuse (branch feat/live-view):
# adds a Logfire-style live timeline view at /project/<id>/live.
# Mirrors the official stack: https://langfuse.com/self-hosting/docker-compose
#
# Images are published by the fork's GitHub Actions (.github/workflows/publish-ghcr.yml):
#   ghcr.io/rlongdragon/langfuse:live-view          (web)
#   ghcr.io/rlongdragon/langfuse-worker:live-view   (worker)
# To build them yourself instead of pulling:
#   docker build -f web/Dockerfile    -t ghcr.io/rlongdragon/langfuse:live-view        https://github.com/rlongdragon/langfuse.git#feat/live-view
#   docker build -f worker/Dockerfile -t ghcr.io/rlongdragon/langfuse-worker:live-view https://github.com/rlongdragon/langfuse.git#feat/live-view
#
# Headless init (LANGFUSE_INIT_*) pre-creates the org/project/user + API keys,
# so no manual UI signup is needed. All secrets come from .env.langfuse
# (see .env.langfuse.example) — nothing secret is committed here.
#
#   cp .env.langfuse.example .env.langfuse   # then fill in the values
#   docker compose --env-file .env.langfuse -f docker-compose.langfuse.yml up -d
#   UI: http://localhost:3001   login: admin@example.com / $LANGFUSE_INIT_USER_PASSWORD
#
# The postgres / clickhouse / redis / minio passwords below are the official
# Langfuse compose defaults for the internal docker network (only the UI and
# minio are published on the host); rotate them too if you expose this stack.

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?set in .env.langfuse}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set in .env.langfuse}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set in .env.langfuse}
  NEXTAUTH_URL: http://localhost:3001
  TELEMETRY_ENABLED: "false"
  # v4 default is events_only; the fork's Live timeline (and the legacy
  # observations/traces UI + public API) read the legacy tables, so keep
  # writing both.
  LANGFUSE_MIGRATION_V4_WRITE_MODE: dual
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: clickhouse
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: myredissecret
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

x-langfuse-depends-on: &langfuse-depends-on
  postgres: { condition: service_healthy }
  clickhouse: { condition: service_healthy }
  minio: { condition: service_healthy }
  redis: { condition: service_healthy }

services:
  langfuse-web:
    image: ghcr.io/rlongdragon/langfuse:live-view
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "3001:3000"
    environment:
      <<: *langfuse-env
      # browser-reachable media endpoint (minio published on host :9090)
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      # --- headless bootstrap: org + project + user + fixed API keys ---
      LANGFUSE_INIT_ORG_ID: coworker-org
      LANGFUSE_INIT_ORG_NAME: Coworker
      LANGFUSE_INIT_PROJECT_ID: coworker
      LANGFUSE_INIT_PROJECT_NAME: coworker
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?set in .env.langfuse}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?set in .env.langfuse}
      LANGFUSE_INIT_USER_EMAIL: admin@example.com
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?set in .env.langfuse}

  langfuse-worker:
    image: ghcr.io/rlongdragon/langfuse-worker:live-view
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment: *langfuse-env

  postgres:
    image: postgres:17
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server

  minio:
    image: minio/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "9090:9000"
      - "127.0.0.1:9091:9001"
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server /data --console-address ":9001"'
    volumes:
      - langfuse_minio:/data

  redis:
    image: redis:7
    restart: unless-stopped
    command: --requirepass myredissecret --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "myredissecret", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - langfuse_redis:/data

volumes:
  langfuse_postgres:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio:
  langfuse_redis:
